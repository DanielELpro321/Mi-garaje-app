[package]
name = "mi-garaje"
version = "1.0.0"
edition = "2021"
description = "Mi Garaje - garaje digital para tu moto, valores colombianos"

[lib]
name = "mi_garaje"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mi-garaje"
path = "src/main.rs"

[dependencies]
# `android-native-activity` permite usar NativeActivity sin escribir Java.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Puente JNI crudo con el teclado del sistema Android (ver `src/ime.rs`).
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4"

[profile.release]
opt-level = 2
