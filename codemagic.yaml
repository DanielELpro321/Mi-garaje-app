workflows:
  mi-garaje-ios-unsigned:
    name: Mi Garaje - iOS sin firma
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app_flutter
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Obtener dependencias Flutter
        script: flutter pub get
      - name: Compilar iOS release sin firma
        script: flutter build ios --release --no-codesign
      - name: Empaquetar IPA sin firma
        script: |
          set -e
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          rm -f MiGaraje-unsigned.ipa
          /usr/bin/zip -qr -X MiGaraje-unsigned.ipa Payload
          rm -rf Payload
          test -s MiGaraje-unsigned.ipa
    artifacts:
      - app_flutter/*.ipa
