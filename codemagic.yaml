workflows:
  mi-garaje-ios-simulator:
    name: Mi Garaje - iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app_flutter
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Obtener dependencias Flutter
        script: flutter pub get
      - name: Compilar para simulador iOS
        script: flutter build ios --simulator --debug
      - name: Preparar app para Appetize o BrowserStack
        script: |
          set -e
          cd build/ios/iphonesimulator
          rm -f Runner-simulator.zip
          zip -qry Runner-simulator.zip Runner.app
          test -s Runner-simulator.zip
          ls -lh Runner-simulator.zip
    artifacts:
      - app_flutter/build/ios/iphonesimulator/Runner-simulator.zip

  mi-garaje-ios-unsigned:
    name: Mi Garaje - iOS sin firma
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app_flutter
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: |
          flutter pub get
      - name: Compilar app iOS sin firma
        script: |
          flutter build ios --release --no-codesign
      - name: Empaquetar IPA sin firma
        script: |
          rm -rf build/ios/ipa && mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qry App-unsigned.ipa Payload && rm -rf Payload)
          test -s build/ios/ipa/App-unsigned.ipa
          ls -lh build/ios/ipa/App-unsigned.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - app_flutter/build/ios/ipa/*.ipa
