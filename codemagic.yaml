workflows:
  mi-garaje-ios-unsigned:
    name: Mi Garaje - iOS sin firma
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app_flutter
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Obtener dependencias Flutter
        script: flutter pub get
      - name: Compilar iOS release sin firma
        script: flutter build ios --release --no-codesign
      - name: Empaquetar IPA sin firma
        script: |
          set -e
          rm -rf build/ios/ipa && mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qry MiGaraje-unsigned.ipa Payload && rm -rf Payload)
          test -s build/ios/ipa/MiGaraje-unsigned.ipa
          ls -lh build/ios/ipa/MiGaraje-unsigned.ipa
    artifacts:
      - app_flutter/build/ios/ipa/*.ipa