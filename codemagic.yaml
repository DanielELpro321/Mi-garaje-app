workflows:
  ios-workflow:
    name: Compilar IPA iOS (sin firma, para Sideloadly/AltStore)
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: app_flutter
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: |
          flutter pub get
      - name: Compilar app iOS sin firma
        script: |
          flutter build ios --release --no-codesign
      - name: Empaquetar IPA sin firma
        script: |
          rm -rf build/ios/ipa && mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -qry App-unsigned.ipa Payload && rm -rf Payload
          ls -la
    artifacts:
      - build/ios/ipa/*.ipa
      - app_flutter/build/ios/ipa/*.ipa
